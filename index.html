<!doctype html>
<html lang="en">
<head>

  <header class="topbar">

        <div class="sidebar-foot">

          Topic hierarchy, linked sections, search and notes content.
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main id="app" tabindex="-1"></main>
